<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Web Project - Car Sales</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f2f2f2;
    }

    header {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      background-color: #444;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
    }

    .container {
      padding: 20px;
    }

    .car-listing {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: space-around;
    }

    .car-card {
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 300px;
      padding: 10px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    .car-card img {
      width: 100%;
      border-radius: 5px;
    }

    .car-card h3 {
      margin: 10px 0 5px;
    }

    .car-card p {
      margin: 0;
      font-size: 14px;
    }

    .gallery-button {
      display: block;
      width: 200px;
      margin: 30px auto;
      text-align: center;
      padding: 10px;
      background-color: #007BFF;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>BitBay Auction</h1>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Cars</a>
    <a href="#">Contact</a>
  </nav>

  <div class="container">
    <h2>Cars for Sale</h2>
    <div class="car-listing">
     
      <div class="car-card">
        <img src="https://www.carscoops.com/wp-content/uploads/2021/04/2022-Mercedes-AMG-GLC-63-S-00.jpg" alt="Mercedes C63 AMG">
        <h3>Mercedes GLE 63 AMG</h3>
        <p>Year: 2021<br>Price: £89,000<br>Condition: Like New</p>
      </div>

      <div class="car-card">
        <img src="https://www.europeanprestige.co.uk/blobs/stock/72/images/048c9d76-99ea-4d06-ac84-ed7a0243512c/1j6a0166-edit.jpg?width=2000&height=1333" alt="Mercedes GLE 63 Coupe">
        <h3>Mercedes C63 Coupe</h3>
        <p>Year: 2019<br>Price: £69,000<br>Condition: Excellent</p>
      </div>

      <div class="car-card">
        <img src="https://i.pinimg.com/736x/ae/bd/79/aebd797bb7387779ff7f11d7c9743622.jpg" alt="Mercedes E63 S">
        <h3>Mercedes E63 S</h3>
        <p>Year: 2020<br>Price: £78,000<br>Condition: Great</p>
      </div>

    </div>

    <a class="gallery-button" href="/car-sales-project/gallery.html">View Gallery</a>
  </div>

  <footer>
    <p>&copy; 2025 Car Sales by Student</p>
  </footer>

</body>
</html>
